name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      # pyproject.toml pulls in `hecate-agent` as an editable path dependency
      # at ../Hecate-Core, which only exists locally because the two repos are
      # checked out as siblings. actions/checkout refuses to write anywhere
      # outside the workspace, so land the Hecate-Core repo in a scratch
      # subdirectory and move it up to the sibling slot afterwards.
      #
      # Hecate-Core is private, and this job's GITHUB_TOKEN can only read this
      # repository, so the checkout failed with "Not Found" on every run since
      # it went private. HECATE_CORE_DEPLOY_KEY is a read-only deploy key
      # registered on Hecate-Core; its private half lives in this repo's secrets.
      - name: Checkout Hecate-Core (sibling dependency for hecate-agent)
        uses: actions/checkout@v5
        with:
          repository: Hecate-Org/Hecate-Core
          ref: ${{ vars.HECATE_CORE_REF || 'main' }}
          path: .hecate-core-checkout
          ssh-key: ${{ secrets.HECATE_CORE_DEPLOY_KEY }}

      - name: Move Hecate-Core alongside this checkout
        run: mv .hecate-core-checkout ../Hecate-Core

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -v
