[project]
name = "hecate-runner"
version = "0.1.0"
description = "Autonomous Hecate Threat Hunter Runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrizoSec" }]
keywords = ["threat-hunting", "cti", "hecate", "security", "agentic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6.0",
    "feedparser>=6.0.12",
    # [all] deliberately, not the bare package. The runner drives hecate_agent
    # in-process, so the agent's optional capabilities resolve against *this*
    # environment, not the one HECATE_BIN points at. Installing it bare left
    # ATT&CK STIX, scikit-learn, Tavily and pySigma missing here while present
    # in the workspace venv, so technique lookup, similarity, research
    # grounding and Sigma validation were all silently inert.
    "hecate-agent[all]",
    "slack-bolt>=1.20.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Frontmatter correctness is asserted by parsing it; the runtime
    # itself writes YAML by hand and needs no parser.
    "pyyaml>=6.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]

[project.scripts]
hecate-runner = "hecate_runner.cli:app"

[project.urls]
Homepage = "https://github.com/Hecate-Org/Hecate-Runner"
Repository = "https://github.com/Hecate-Org/Hecate-Runner"
Issues = "https://github.com/Hecate-Org/Hecate-Runner/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecate_runner"]

# --- Dev dependency group -------------------------------------------------
# PEP 735 group, installed by `uv sync` by default. Replaces the deprecated
# [tool.uv] dev-dependencies key, which uv warned about on every invocation.
[dependency-groups]
dev = [
    "pytest>=8.0",
    # Frontmatter correctness is asserted by parsing it; the runtime
    # itself writes YAML by hand and needs no parser.
    "pyyaml>=6.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.9",
]

# --- Ruff (linter + formatter) -------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts fine in tests

# --- mypy ----------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
files = ["src/hecate_runner"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tavily.*"
ignore_missing_imports = true

# hecate-agent ships no py.typed marker, so mypy cannot see into it.
[[tool.mypy.overrides]]
module = "hecate_agent.*"
ignore_missing_imports = true

# Following tiktoken pulls in numpy's stubs, which use 3.12-only syntax that a
# python_version = "3.11" check cannot parse -- the whole run then stops.
[[tool.mypy.overrides]]
module = ["tiktoken", "tiktoken.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["slack_bolt", "slack_bolt.*", "slack_sdk", "slack_sdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hecate_runner.slack_bot"
disallow_untyped_decorators = false

# --- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=hecate_runner",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["src/hecate_runner"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv.sources]
hecate-agent = { path = "../Hecate-Core", editable = true }
